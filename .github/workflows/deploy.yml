
name: Deploy ZIP to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract website
        run: |
          mkdir -p public
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip -o "$ZIP" -d extracted

          if [ -f extracted/index.html ]; then
            cp -a extracted/. public/
          else
            DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$DIR" ] && [ -f "$DIR/index.html" ]; then
              cp -a "$DIR"/. public/
            else
              cp -a extracted/. public/
            fi
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
